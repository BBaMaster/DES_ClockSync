name: Build Report PDF

on:
  push:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/**"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Install fonts
        run: sudo apt-get install -y fonts-open-sans

      - name: Compile PDFs
        run: |
          typst compile --root . docs/report/report.typ docs/report/report.pdf
          typst compile --root . docs/report/report_short.typ docs/report/report_short.pdf

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            docs/report/report.pdf
            docs/report/report_short.pdf
          archive: true
